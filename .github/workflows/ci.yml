name: CI

# The gate, not a report card. It runs on the branch work happens on
# (``develop``), on every PR into ``main``, and on ``main`` itself.
# ``main`` is protected: it takes pull requests only, and these jobs
# are the required checks, so the branch Coolify deploys from cannot
# receive code that hasn't passed. ``docs/deploy.md`` § 14 has the
# branch rule.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Cancel earlier runs on the same branch when a new push lands so a long
# tail of stale jobs doesn't keep CI minutes burning. Never cancel a
# ``main`` run: that one is the record of what shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # One place for the versions every job pins.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------------
  # Frontend: type-check, unit tests, and the one SPA build the rest of
  # the pipeline reuses. Nothing else in CI runs ``vite build``.
  # --------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build the SPA
        # ``build-only`` skips vue-tsc, which the step above already did.
        run: npm run build-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spa-dist
          path: frontend/dist
          retention-days: 1

  # --------------------------------------------------------------------
  # Backend: lint, types, tests, migrations. Needs the built SPA because
  # ``routers/spa.py`` mounts nothing without it, and a server that
  # isn't serving the app 404s the SEO / soft-404 / canonical-host /
  # ads suites.
  # --------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opkomst
          POSTGRES_PASSWORD: opkomst
          POSTGRES_DB: opkomst
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opkomst -d opkomst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # tests/conftest.py auto-creates an ``opkomst_test`` database
      # alongside ``opkomst`` and pins DATABASE_URL itself; the value
      # here is just for any module-import that reads it before the
      # conftest fixture overrides.
      JWT_SECRET: test-jwt-secret-not-for-real-use
      EMAIL_ENCRYPTION_KEY: 19zJgFa6AyDoFI90PVOcY3/A8xH/3qXGyJt/hAVlCOA=
      EMAIL_BACKEND: console
      MESSAGE_ID_DOMAIN: ci.opkomst.local
      PUBLIC_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      BOOTSTRAP_ADMIN_EMAIL: admin@local.dev
      LOCAL_MODE: "0"
      # ``tests/conftest.py`` defaults to this when nothing is set; the
      # value has to match, or the suite sees an organisation it wasn't
      # written for. Required, no default in ``Settings``.
      TENANTS: rsp:RSP
      DATABASE_URL: postgresql+psycopg://opkomst:opkomst@localhost:5433/opkomst
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-dist
          path: frontend/dist
      - name: Lint (ruff, flake8-bandit included)
        run: uv run ruff check backend tests
      - name: Type-check (pyright)
        run: uv run pyright backend
      - name: Colours and logos live in brands/
        run: uv run python scripts/check_brand_tokens.py
      - name: Tests + coverage gate
        run: uv run pytest
      - name: Migrations are idempotent
        # Apply migrations to a fresh DB, then re-apply to the same
        # DB. Both invocations must succeed cleanly. Catches the
        # class of bug where a migration assumes "this column doesn't
        # exist yet" rather than checking — running the same revision
        # twice on the same DB is the closest CI-friendly proxy for
        # "what happens when a deploy retries after a transient
        # failure".
        run: |
          uv run alembic -c backend/alembic.ini downgrade base
          uv run alembic -c backend/alembic.ini upgrade head
          uv run alembic -c backend/alembic.ini upgrade head

  # --------------------------------------------------------------------
  # The generated types match the routes that generate them.
  # --------------------------------------------------------------------
  schema-drift:
    # Regenerate openapi.json + frontend/src/api/schema.ts on every PR
    # and fail if the working tree differs from HEAD. A backend schema
    # change without its matching commit-of-the-generated-types is the
    # exact "frontend type drift" bug A3 was supposed to make
    # structurally impossible — this gate enforces it.
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci
      EMAIL_ENCRYPTION_KEY: 19zJgFa6AyDoFI90PVOcY3/A8xH/3qXGyJt/hAVlCOA=
      EMAIL_BACKEND: console
      MESSAGE_ID_DOMAIN: ci.opkomst.local
      PUBLIC_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      # Required, no default: ``make openapi`` constructs ``Settings``.
      TENANTS: rsp:RSP
      DATABASE_URL: postgresql+psycopg://opkomst:opkomst@localhost:5433/opkomst
      OPKOMST_SKIP_BOOT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest
          enable-cache: true
      - run: uv sync --all-groups
      - run: cd frontend && npm ci
      - name: Regenerate openapi.json + schema.ts
        run: make openapi
      - name: Diff against HEAD
        run: |
          if ! git diff --exit-code --quiet openapi.json frontend/src/api/schema.ts; then
            echo "::error::openapi.json or frontend/src/api/schema.ts is out of date — run 'make openapi'"
            git diff openapi.json frontend/src/api/schema.ts
            exit 1
          fi

  # --------------------------------------------------------------------
  # The artifact that actually ships. Building it here means a broken
  # Dockerfile fails a run instead of a deploy, and Trivy sees the base
  # image's CVEs, which Dependabot never does.
  # --------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: opkomst:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opkomst:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: It migrates, boots and answers /health
        # The image's CMD runs ``cli migrate`` before uvicorn, so this
        # exercises the real first-deploy path: migrations onto an empty
        # schema from inside the built image, then the app, then
        # ``/health`` — the endpoint Coolify's own healthcheck polls.
        #
        # The database is started here rather than as a job ``service``.
        # A service's port is published for the runner, not for a
        # container, and reaching it from one means guessing at the
        # network the runner made. Its own network, its own postgres,
        # nothing to guess.
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=opkomst \
            -e POSTGRES_PASSWORD=opkomst \
            -e POSTGRES_DB=opkomst \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U opkomst -d opkomst >/dev/null 2>&1 && break
            sleep 1
          done

          # Minted here rather than written down: a literal 32-byte
          # base64 key in a workflow is a secret-scanner hit forever,
          # and this container only has to boot.
          docker run -d --name smoke --network smoke-net -p 8000:8000 \
            -e JWT_SECRET="$(openssl rand -hex 16)" \
            -e EMAIL_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e EMAIL_BACKEND=console \
            -e MESSAGE_ID_DOMAIN=ci.opkomst.local \
            -e PUBLIC_BASE_URL=http://localhost:8000 \
            -e CORS_ORIGINS=http://localhost:8000 \
            -e TENANTS=rsp:RSP \
            -e WEB_CONCURRENCY=1 \
            -e DATABASE_URL=postgresql+psycopg://opkomst:opkomst@smoke-db:5432/opkomst \
            opkomst:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the image never answered /health"
          docker logs smoke
          docker logs smoke-db | tail -20
          exit 1

  # --------------------------------------------------------------------
  # The browser's view. Last, because a red backend or frontend already
  # explains the symptom and a Playwright boot is expensive.
  # --------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opkomst
          POSTGRES_PASSWORD: opkomst
          POSTGRES_DB: opkomst
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opkomst -d opkomst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Same defaults as the backend job — playwright.config.ts boots
      # both servers via webServer; they read these from process env.
      JWT_SECRET: test-jwt-secret-not-for-real-use
      EMAIL_ENCRYPTION_KEY: 19zJgFa6AyDoFI90PVOcY3/A8xH/3qXGyJt/hAVlCOA=
      EMAIL_BACKEND: console
      MESSAGE_ID_DOMAIN: ci.opkomst.local
      PUBLIC_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      BOOTSTRAP_ADMIN_EMAIL: admin@local.dev
      LOCAL_MODE: "1"
      # The seeded demo is one organisation; the webServer boots
      # ``Settings``, which requires this.
      TENANTS: rsp:RSP
      DATABASE_URL: postgresql+psycopg://opkomst:opkomst@localhost:5433/opkomst
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest
          enable-cache: true
      - name: Sync backend
        run: uv sync --all-groups
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Provide an empty .env for the playwright webServer
        # The webServer command sources ../.env if present; an empty
        # one is fine since the vars are already inherited from the
        # job-level env: block.
        run: touch .env
      - name: Apply migrations
        # ``cli seed-demo`` doesn't bootstrap the schema — it
        # expects the migrations to already have run. The
        # webServer would run them on first request, but
        # ``seed-demo`` runs first.
        run: uv run alembic -c backend/alembic.ini upgrade head
      - name: Seed local-mode demo data
        # ``admin@local.dev`` + ``organiser@local.dev`` accounts +
        # demo events. Required for the e2e tests' dev-issue-token
        # path; pre-R4.3 this fired automatically on boot, since
        # R4.3 it's an explicit CLI invocation.
        run: uv run python -m backend.cli seed-demo
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
