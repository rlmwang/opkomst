name: Security

# What Dependabot cannot see. Dependabot opens PRs for advisories on the
# deps we declare; this workflow audits the *resolved* trees, reads the
# code for injection and taint, and looks for secrets and workflow
# misconfiguration. It runs on every PR (so a change is judged before it
# lands), on pushes to the branches that ship, and weekly — because a
# CVE published on Tuesday does not wait for someone to open a PR.
#
# Deliberately not gating the deploy: a new advisory in a transitive dep
# is not a reason to block a hotfix at 02:00. It fails loudly, in its own
# workflow, and ``docs/runbook.md`` says what to do about it.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC, an hour before Dependabot
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Known CVEs in what we actually install.
  # --------------------------------------------------------------------
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest
          enable-cache: true
      - name: Sync backend
        run: uv sync --all-groups
      - name: Audit Python (pip-audit)
        # The resolved environment, so transitive deps count. Runtime
        # and dev both: a compromised test-only package still executes
        # on this runner with the repo checked out.
        run: uvx pip-audit --strict --progress-spinner off
      - name: Audit npm
        working-directory: frontend
        # ``high`` is the gate. Moderate advisories in build-only tooling
        # would otherwise keep this red permanently, and a permanently
        # red check is one nobody reads.
        run: npm audit --audit-level=high

  # --------------------------------------------------------------------
  # A PR that introduces a vulnerable or badly-licensed dep is refused
  # before it merges, rather than found by the audit above afterwards.
  # --------------------------------------------------------------------
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          # EUPL-1.2 project: copyleft-compatible in, proprietary out.
          deny-licenses: LGPL-2.0, BSD-2-Clause-Patent

  # --------------------------------------------------------------------
  # Taint analysis: the half of SAST ruff's ``S`` rules cannot do.
  # --------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:${{ matrix.language }}

  # --------------------------------------------------------------------
  # Secrets, and the workflows themselves.
  # --------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # gitleaks diffs the history it can see; a shallow clone hides
          # the commit that added the key.
          fetch-depth: 0
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest
      - name: Audit the workflows (zizmor)
        # Template-injection through ``${{ }}``, over-broad token
        # permissions, unpinned actions: the CI pipeline is code with
        # credentials, and nothing else reviews it.
        run: uvx zizmor --persona=regular .github/workflows
