<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The tenant's brand is injected here: first-paint colours, the
      palette stylesheet, the icons, and ``window.__OPKOMST_BRAND__``
      (logo + wordmark + org link). ``backend/services/brand.py`` builds
      the markup and the Vite dev server substitutes the same thing.
      Marker comment below; do not remove.
    -->
    <!-- OPKOMST_BRAND_INJECTION -->
    <!--
      The backend's ``/e/{chapter}`` handler injects per-chapter
      ``<title>`` + Open Graph + Twitter Card meta tags here so
      link previews show "Agenda · {chapter}" instead of a generic
      "opkomst.nu". For unknown slugs the injection falls back to
      the bare site title. Marker comment below; do not remove.
    -->
    <!-- OPKOMST_HEAD_INJECTION -->
    <!--
      Inline first-paint loader: visible the instant the HTML
      arrives and replaced when Vue mounts onto ``#app``. Same
      pattern as the admin SPA but stripped of every byte that
      isn't strictly needed — this is the page visitors land on
      cold via QR code, often on slow mobile networks.
    -->
    <style>
      html { box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--boot-bg);
        color: var(--boot-fg);
        line-height: 1.5;
      }
      .app-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 1rem;
      }
      .app-boot-ring {
        width: 36px; height: 36px;
        border: 3px solid var(--boot-border);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      .app-boot-text { color: var(--boot-fg-muted); font-size: 0.9375rem; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!--
      The backend's ``/e/{chapter}`` handler injects a ``<script>``
      block here that defines ``window.__OPKOMST_CHAPTER__`` with
      the agenda payload (or ``null`` if the slug isn't known).
      The mini-app reads it on mount and renders without an API
      round-trip. Marker comment below; do not remove.
    -->
    <!-- OPKOMST_CHAPTER_INJECTION -->
    <div id="app">
      <div class="app-boot" aria-hidden="true">
        <div class="app-boot-ring"></div>
        <div class="app-boot-text">opkomst</div>
      </div>
    </div>
    <script type="module" src="/src/public_chapter/main.ts"></script>
  </body>
</html>
