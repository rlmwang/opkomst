<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The tenant's brand is injected here: first-paint colours, the
      palette stylesheet, the icons, and ``window.__OPKOMST_BRAND__``
      (logo + wordmark + org link). ``backend/services/brand.py`` builds
      the markup and the Vite dev server substitutes the same thing.
      Marker comment below; do not remove.
    -->
    <!-- OPKOMST_BRAND_INJECTION -->
    <!--
      The backend's ``/d/{slug}`` handler injects per-roster
      ``<title>`` + Open Graph + Twitter Card meta tags here so link
      previews show the roster name. For unknown slugs the injection
      falls back to the bare site title. Marker comment below; do not
      remove.
    -->
    <!-- OPKOMST_HEAD_INJECTION -->
    <style>
      html { box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--brand-bg);
        color: var(--brand-text);
        line-height: 1.5;
      }
      .app-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 1rem;
      }
      .app-boot-ring {
        width: 36px; height: 36px;
        border: 3px solid var(--brand-border);
        border-top-color: var(--brand-red);
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      .app-boot-text { color: var(--brand-text-muted); font-size: 0.9375rem; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!--
      The backend's ``/d/{slug}`` handler injects a ``<script>`` block
      here that defines ``window.__OPKOMST_CHORE__`` with the poll
      payload (or ``null`` if the slug isn't known or the roster is
      archived). The mini-app reads it on mount and renders without an
      API round-trip. Marker comment below; do not remove.
    -->
    <!-- OPKOMST_CHORE_INJECTION -->
    <!-- OPKOMST_SUBMISSION_INJECTION -->
    <div id="app">
      <div class="app-boot" aria-hidden="true">
        <div class="app-boot-ring"></div>
        <div class="app-boot-text">opkomst</div>
      </div>
    </div>
    <script type="module" src="/src/public_chore/main.ts"></script>
  </body>
</html>
