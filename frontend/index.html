<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The tenant's brand is injected here: first-paint colours, the
      palette stylesheet, the icons, and ``window.__OPKOMST_BRAND__``
      (logo + wordmark + org link). ``backend/services/brand.py`` builds
      the markup and the Vite dev server substitutes the same thing.
      Marker comment below; do not remove.
    -->
    <!-- OPKOMST_BRAND_INJECTION -->
    <!--
      Per-page title, description and canonical, for the five paths a
      stranger can reach. ``backend/routers/spa.py::_app_head_meta``
      substitutes this; every other route gets a bare title and
      ``noindex``, because an organiser's dashboard has no business
      being described to a crawler. The Vite dev server fills it with
      the same thing. Marker comment below; do not remove.
    -->
    <!-- OPKOMST_HEAD_INJECTION -->
    <!--
      Inline first-paint loader. Visible the instant the HTML
      arrives, replaced when Vue mounts onto ``#app``. Kills the
      "blank screen for a long time" perception on slow connections
      while the JS bundle downloads + parses. Inlined (not a CSS
      file) so it never costs an extra request.
    -->
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--boot-bg); color: var(--boot-fg); }
      .app-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 1rem;
      }
      .app-boot-ring {
        width: 36px; height: 36px;
        border: 3px solid var(--boot-border);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      .app-boot-text { color: var(--boot-fg-muted); font-size: 0.9375rem; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" aria-hidden="true">
        <div class="app-boot-ring"></div>
        <div class="app-boot-text">opkomst</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
