[project]
name = "opkomst"
version = "0.1.0"
description = "Privacy-first event sign-up tool"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.13",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.6",
    # JWT signing/verifying. ``pyjwt`` is the canonical library
    # and is actively maintained; ``python-jose`` has had security
    # advisories and lower commit cadence. Smaller wheel too.
    "pyjwt>=2.10",
    "structlog>=24",
    "cryptography>=44",
    # The QR endpoint serves SVG via ``qrcode.image.svg`` which is
    # pure Python — Pillow isn't needed for that. It IS needed by
    # ``services/event_image.py`` (organiser-uploaded photos go
    # through EXIF rotate + center-crop + JPEG re-encode before
    # being PUT to GitHub). Modern manylinux Pillow wheels bundle
    # libjpeg/libpng so the slim base image needs no extra apt
    # deps for either path.
    "qrcode>=8",
    "pillow>=11",
    # ``UploadFile`` / multipart form parsing on the event-image
    # upload endpoint. FastAPI imports it lazily; without this
    # dep the first multipart request raises a 500.
    "python-multipart>=0.0.20",
    "nanoid>=2",
    "uuid-utils>=0.10",
    "jinja2>=3.1",
    "slowapi>=0.1.9",
    # The client ``limits`` (slowapi's storage layer) needs when
    # ``RATE_LIMIT_STORAGE_URI`` is a redis:// URL. Production shares
    # one set of counters across uvicorn workers; without this the URI
    # raises at boot.
    "redis>=5",
    "sentry-sdk>=2.58.0",
    # Async HTTP client for the Evolution API proxy in
    # ``services/whatsapp.py``. Also pulled in by Starlette's
    # ``TestClient`` so tests would see it regardless.
    "httpx>=0.28",
    "nh3>=0.2",
    # The written pages are markdown files in ``backend/content``,
    # rendered once at import (``services/content.py``). Python-Markdown
    # rather than a bigger toolchain: it is pure Python, it ships the
    # two extensions these pages need (tables, and a class on a
    # paragraph), and the input is our own repository rather than
    # anything a user typed.
    "markdown>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.7",
    "pyright>=1.1",
    "freezegun>=1.5",
    "hypothesis>=6",
    # Mocks ``httpx`` calls in unit tests so the Evolution API proxy
    # can be exercised without a real instance.
    "respx>=0.21",
]

[tool.ruff]
line-length = 120
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
# ``S`` is flake8-bandit: the cheap half of SAST, run by the linter we
# already run on every commit (weak crypto, shell injection, unsafe
# deserialisation, bound-to-all-interfaces). CodeQL in the security
# workflow does the taint analysis this can't.
select = ["E", "F", "W", "I", "B", "UP", "S"]
# B008 fires on every FastAPI ``Depends(...)`` default — that's the
# canonical pattern, not a bug. UP047 wants PEP 695 generics, but
# we're staying on classic ``TypeVar`` for compatibility with
# SQLAlchemy mapper introspection. S101 is ``assert``, which this
# codebase uses to narrow a type for pyright, never to validate input.
# S105/S106 flag any constant whose *name* contains "token" — every hit
# is a sentinel or a fixture, and real leaked secrets are gitleaks'
# and GitHub push-protection's job.
ignore = ["B008", "UP047", "S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
# A test suite asserts, seeds fake credentials, and writes literal SQL
# on purpose. Bandit rules describe production code.
"tests/**" = ["S"]
# The kompas builds two statements around one shared CTE, so the rules
# it draws a map from are written once. The only thing interpolated is
# that module constant: no value from a request reaches the SQL, which
# is parameterised throughout.
"backend/services/compass.py" = ["S608"]

[tool.pyright]
include = ["backend", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.13"

[tool.pytest.ini_options]
# Each xdist worker gets its own ``opkomst_test_<worker>`` database
# (see ``conftest._TEST_DB_URL``). ``--dist=worksteal`` lets idle
# workers steal pending tests from busy ones, which packs the
# heavy property/e2e tests across cores instead of stalling on
# whoever drew the longest straw. Module-level state in test files
# (the ``_slug_counter`` in tests/_helpers/events.py, fake-email
# installs) is process-local — but each worker has its own DB so
# slug collisions across workers don't happen. Coverage is
# collected via pytest-cov's xdist integration. Override at the
# CLI with ``-n 0`` for single-process runs (handy when debugging
# a fixture).
# Eight workers, not ``auto`` (twelve here). Back when every test began
# with a TRUNCATE the suite queued on the one postgres and got *slower*
# with more workers: 40s at four, 64s at eight, 76s at twelve. Tests run
# in a transaction now (``tests/conftest.py``), the queue is gone, and
# the curve points the right way again: 38s at four, 22s at eight. Eight
# rather than twelve leaves cores for the frontend build that runs
# beside it at push time.
addopts = "-n 8 --dist=worksteal --cov=backend --cov-report=term-missing --cov-fail-under=64"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "backend/alembic/*",
    "backend/seed.py",
    # Live SMTP backend — tested via aiosmtpd integration test in B4.1
    # (not yet present); excluded from the coverage gate until then.
    "backend/services/email/smtp.py",
]
