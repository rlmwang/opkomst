pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "backend/**/*.py"
      # ``--force-exclude`` makes ruff honor ``[tool.ruff].extend-exclude``
      # even when paths are passed explicitly (otherwise the alembic
      # versions dir gets linted). Mirrors the format command below.
      run: uv run ruff check --force-exclude {staged_files}
    ruff-format:
      glob: "backend/**/*.py"
      run: uv run ruff format --check --force-exclude {staged_files}
    brand-tokens:
      # Colours and logos belong in ``brands/{tenant}/``. Cheap grep
      # over the frontend + mail templates; the glob gates whether to
      # run at all, the script always checks everything.
      glob: "{frontend/**/*,backend/services/mail_templates/**/*}"
      run: uv run python scripts/check_brand_tokens.py
    pyright:
      glob: "backend/**/*.py"
      # Pyright takes the whole project rather than per-file; the
      # glob just gates whether to run at all. Mirrors the CI
      # backend job's pyright step so type-drift never makes it
      # to a CI run that's already failed somewhere else.
      run: uv run pyright backend

# Pre-push runs the fast half of the pipeline: a type-checked build, the
# vitest suite and the openapi drift check. It is a courtesy, not a gate.
#
# The gate is CI, and since the ``deploy`` job hangs off it, a red CI run
# now stops a deploy instead of merely reporting one. Running pytest and
# Playwright here as well bought a second implementation of the same
# pipeline that drifted from the real one — CI had no SPA build for
# weeks and nobody noticed, because ``frontend/dist`` exists on a
# developer machine and the local run passed. One pipeline, in the place
# that can actually stop a release.
#
# Run the rest on demand: ``make test`` for the backend suite, ``make
# e2e`` for Playwright.
#
# Skip with ``LEFTHOOK=0 git push`` (or ``--no-verify``).
pre-push:
  piped: true
  commands:
    1_venv:
      # When ``pyproject.toml`` or ``uv.lock`` is in the push, force a
      # fresh ``uv sync`` before anything runs it — otherwise a "drop
      # unused dep" change passes locally because the existing venv
      # still has the dep, then goes red on CI, which installs clean.
      # Found via the httpx incident: removed from prod deps in 7e62ea6
      # but starlette.testclient needs it.
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^(pyproject\.toml|uv\.lock)$'; then
          echo "lockfile changed — syncing venv to match"
          uv sync --frozen --quiet
        fi
    2_checks:
      # Frontend build (svelte-check + vite), vitest and the openapi drift
      # check, concurrently. None of them holds a timeout, so they may
      # fight each other for cores all they like.
      run: make -j3 pre-push-checks
