pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "backend/**/*.py"
      # ``--force-exclude`` makes ruff honor ``[tool.ruff].extend-exclude``
      # even when paths are passed explicitly (otherwise the alembic
      # versions dir gets linted). Mirrors the format command below.
      run: uv run ruff check --force-exclude {staged_files}
    ruff-format:
      glob: "backend/**/*.py"
      run: uv run ruff format --check --force-exclude {staged_files}
    brand-tokens:
      # Colours and logos belong in ``brands/{tenant}/``. Cheap grep
      # over the frontend + mail templates; the glob gates whether to
      # run at all, the script always checks everything.
      glob: "{frontend/**/*,backend/services/mail_templates/**/*}"
      run: uv run python scripts/check_brand_tokens.py
    pyright:
      glob: "backend/**/*.py"
      # Pyright takes the whole project rather than per-file; the
      # glob just gates whether to run at all. Mirrors the CI
      # backend job's pyright step so type-drift never makes it
      # to a CI run that's already failed somewhere else.
      run: uv run pyright backend

# Pre-push runs the full validation pipeline so a green ``git push``
# matches what CI is going to do. Every CI failure so far has been
# something a local pipeline would have caught: a stale openapi schema,
# a vue-tsc duplicate-operationId, e2e selectors mismatched to a
# refactored DOM.
#
# **The order is the point.** ``piped: true`` runs these in sequence and
# stops at the first failure, and the sequence exists because only one
# of these jobs has deadlines. The four checks in ``make -j4
# pre-push-checks`` run concurrently and take as long as they take;
# ``pytest -n auto`` alone claims every core. The e2e job boots a
# uvicorn and a vite dev server, holds a 30s boot timeout and a 60s
# per-test timeout, and compiles routes on demand while it runs, so
# under that load it does not fail on the code, it fails on the clock.
# Six specs timed out at once when it ran beside the others; alone it
# finishes in eleven seconds. Wall-clock costs about a minute; a push
# that fails for a reason nobody can act on costs more.
#
# It also matches CI, where the e2e job carries ``needs: [backend,
# frontend]`` for the same reason: a red backend explains the e2e
# symptom, so running both is a waste of a Playwright boot.
#
# Skip with ``LEFTHOOK=0 git push`` (or use ``--no-verify`` when you
# genuinely know better — e.g. fixing a CI-only flake on main). Don't
# make a habit of it.
pre-push:
  piped: true
  commands:
    1_venv:
      # When ``pyproject.toml`` or ``uv.lock`` is in the push, force a
      # fresh ``uv sync`` before anything runs it — otherwise a "drop
      # unused dep" change passes locally because the existing venv
      # still has the dep, then goes red on CI, which installs clean.
      # Found via the httpx incident: removed from prod deps in 7e62ea6
      # but starlette.testclient needs it.
      run: |
        if git diff --name-only @{u}..HEAD 2>/dev/null | grep -qE '^(pyproject\.toml|uv\.lock)$'; then
          echo "lockfile changed — syncing venv to match"
          uv sync --frozen --quiet
        fi
    2_checks:
      # Backend suite, frontend build, vitest and the openapi
      # drift check, concurrently. None of them holds a timeout, so
      # they may fight each other for cores all they like.
      run: make -j4 pre-push-checks
    3_e2e:
      # Playwright, with the machine to itself.
      #
      # ``E2E_API_PORT`` / ``E2E_FRONTEND_PORT`` keep the test stack off
      # the dev defaults, so a developer with ``uvicorn --reload`` and
      # ``vite dev`` already running doesn't get "address in use".
      # ``CI=1`` forces playwright to spawn its own servers rather than
      # reusing those.
      run: cd frontend && CI=1 E2E_API_PORT=8001 E2E_FRONTEND_PORT=5174 npx playwright test
